<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>System Web</title>
        <link rel="stylesheet" href="/css/styles.css" />
    </head>
    <body>
        <main class="container">
            <section class="panel">
                <p class="eyebrow">System Web</p>
                <h1>Projeto conectado</h1>
                <p class="description">
                    Frontend HTML/JS comunicando com o backend Node.js e Express.
                </p>

                <div class="status-card" aria-live="polite">
                    <span class="status-dot" id="status-dot"></span>
                    <div>
                        <strong id="status-title">Verificando conexão...</strong>
                        <p id="status-message">Aguardando resposta da API.</p>
                    </div>
                </div>

                <button type="button" id="check-button">Testar conexão novamente</button>
            </section>
        </main>
        <script type="module" src="/js/main.js"></script>
    </body>
</html>
